# NOTE: 타겟 호스트는 host.docker.internal 사용 (macOS/Windows)
# Linux에서는 --network=host 또는 Docker 내부 DNS로 변경 필요
# Target host uses host.docker.internal (macOS/Windows)
# For Linux, change to --network=host or Docker internal DNS
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager 연동 (설정 시 활성화) / Alertmanager integration (enable when configured)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

rule_files:
  - 'alert-rules.yml'

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: /metrics

  - job_name: 'market-data'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: /metrics

  - job_name: 'order-engine'
    static_configs:
      - targets: ['host.docker.internal:3002']
    metrics_path: /metrics

  - job_name: 'portfolio'
    static_configs:
      - targets: ['host.docker.internal:3003']
    metrics_path: /metrics

  - job_name: 'notification'
    static_configs:
      - targets: ['host.docker.internal:3004']
    metrics_path: /metrics

  - job_name: 'chat'
    static_configs:
      - targets: ['host.docker.internal:3005']
    metrics_path: /metrics

  - job_name: 'ai-service'
    static_configs:
      - targets: ['host.docker.internal:3006']
    metrics_path: /metrics

  - job_name: 'user-auth'
    static_configs:
      - targets: ['host.docker.internal:3007']
    metrics_path: /metrics
